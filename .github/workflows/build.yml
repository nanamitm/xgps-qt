name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-release:
    name: Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.2"
          host: windows
          target: desktop
          arch: win64_msvc2022_64

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build/windows-release -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build/windows-release --config Release

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/xgps-qt-windows | Out-Null
          Copy-Item -Force build/windows-release/Release/xgps-qt.exe dist/xgps-qt-windows/
          Copy-Item -Force readme.txt dist/xgps-qt-windows/
          windeployqt --release --compiler-runtime dist/xgps-qt-windows/xgps-qt.exe
          Remove-Item -Force dist/xgps-qt-windows/vc_redist.x64.exe -ErrorAction SilentlyContinue

      - name: Create zip
        shell: pwsh
        run: Compress-Archive -Path dist/xgps-qt-windows/* -DestinationPath dist/xgps-qt-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: xgps-qt-windows
          path: dist/xgps-qt-windows.zip

  linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev imagemagick

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.2"
          host: linux
          target: desktop
          arch: linux_gcc_64

      - name: Configure
        run: cmake -S . -B build/linux-release -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/linux-release

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Create AppImage
        run: |
          cmake --install build/linux-release --prefix AppDir/usr

          convert -size 256x256 xc:'#1e90ff' xgps-qt.png

          cat > xgps-qt.desktop << 'EOF'
          [Desktop Entry]
          Name=xgps-qt
          Exec=xgps-qt
          Icon=xgps-qt
          Type=Application
          Categories=Utility;
          EOF

          APPIMAGE_EXTRACT_AND_RUN=1 \
          OUTPUT=xgps-qt-linux-x86_64.AppImage \
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --icon-file xgps-qt.png \
            --desktop-file xgps-qt.desktop \
            --plugin qt \
            --output appimage

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: xgps-qt-linux
          path: xgps-qt-linux-x86_64.AppImage

  linux-appimage-arm64:
    name: Linux AppImage (ARM64)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            imagemagick \
            qt6-base-dev \
            libqt6network6-dev

      - name: Configure
        run: cmake -S . -B build/linux-release -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/linux-release

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-aarch64.AppImage
          chmod +x linuxdeploy-aarch64.AppImage linuxdeploy-plugin-qt-aarch64.AppImage

      - name: Create AppImage
        run: |
          cmake --install build/linux-release --prefix AppDir/usr

          convert -size 256x256 xc:'#1e90ff' xgps-qt.png

          cat > xgps-qt.desktop << 'EOF'
          [Desktop Entry]
          Name=xgps-qt
          Exec=xgps-qt
          Icon=xgps-qt
          Type=Application
          Categories=Utility;
          EOF

          QMAKE=$(which qmake6 || which qmake) \
          APPIMAGE_EXTRACT_AND_RUN=1 \
          OUTPUT=xgps-qt-linux-aarch64.AppImage \
          ./linuxdeploy-aarch64.AppImage \
            --appdir AppDir \
            --icon-file xgps-qt.png \
            --desktop-file xgps-qt.desktop \
            --plugin qt \
            --output appimage

      - name: Upload Linux ARM64 AppImage
        uses: actions/upload-artifact@v4
        with:
          name: xgps-qt-linux-arm64
          path: xgps-qt-linux-aarch64.AppImage

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [windows-release, linux-appimage, linux-appimage-arm64]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: xgps-qt-windows
          path: dist/

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: xgps-qt-linux
          path: dist/

      - name: Download Linux ARM64 AppImage
        uses: actions/download-artifact@v4
        with:
          name: xgps-qt-linux-arm64
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/xgps-qt-windows.zip
            dist/xgps-qt-linux-x86_64.AppImage
            dist/xgps-qt-linux-aarch64.AppImage
